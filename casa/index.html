<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#24433a">
<title>Checklist Supermercado</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,700&display=swap">
<style>
/* Layout: una columna tipo lista de mandados, botones grandes para el pulgar, barra fija abajo para mandar por WhatsApp */
:root{
  --bg:#f6f7f2; --card:#ffffff; --fg:#1d2420; --muted:#66706a; --line:#dfe3da;
  --hay:#1f7a4d; --hay-bg:#e3f2e8; --falta:#c2410c; --falta-bg:#fde8dc; --ink:#24433a;
  --display:"Fraunces", Georgia, serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --card:#1c2320; --fg:#e8ece6; --muted:#9aa59e; --line:#2c3531;
  --hay:#5cc98e; --hay-bg:#173527; --falta:#ff8a4c; --falta-bg:#3a2216; --ink:#9fd4bf; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --card:#1c2320; --fg:#e8ece6; --muted:#9aa59e; --line:#2c3531;
  --hay:#5cc98e; --hay-bg:#173527; --falta:#ff8a4c; --falta-bg:#3a2216; --ink:#9fd4bf; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.4}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px}
h1{font-family:var(--display);font-size:1.9rem;line-height:1.1;margin:0 0 6px;color:var(--ink);text-wrap:balance}
.intro{color:var(--muted);margin:0 0 14px}
.count{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;font-variant-numeric:tabular-nums}
.pill{padding:4px 12px;border-radius:999px;font-weight:700;font-size:.9rem;border:1px solid var(--line);background:var(--card)}
.pill.f{color:var(--falta);background:var(--falta-bg);border-color:transparent}
.pill.h{color:var(--hay);background:var(--hay-bg);border-color:transparent}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{flex:1;min-width:0}
.name small{display:block;color:var(--muted);font-size:.8rem}
.btns{display:flex;gap:6px;flex-shrink:0}
button{font:inherit;cursor:pointer}
.b{min-width:64px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:.92rem}
.b:focus-visible,.act:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
li[data-s="hay"] .bh{background:var(--hay);border-color:var(--hay);color:var(--card)}
li[data-s="falta"] .bf{background:var(--falta);border-color:var(--falta);color:var(--card)}
li[data-s="falta"]{background:var(--falta-bg)}
.otros{width:100%;box-sizing:border-box;min-height:80px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;resize:vertical}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding-top:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:8px}
.act{flex:1;text-align:center;text-decoration:none;padding:14px 10px;border-radius:12px;font-weight:700;border:0}
.wa{background:var(--hay);color:var(--card)}
.sec{flex:0 0 auto;background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.msg{margin-top:20px}
.msg pre{white-space:pre-wrap;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px;font-family:var(--body);font-size:.92rem;margin:6px 0 0;user-select:all}
.toast{color:var(--hay);font-weight:700;font-size:.9rem;min-height:1.2em;margin-top:6px}
.reset{margin-top:18px;background:none;border:0;color:var(--muted);text-decoration:underline;padding:6px 0}
</style>
</head><body>

<div class="wrap">
  <h1>Checklist Supermercado</h1>
  <p class="intro">Hola Dioni. Tocá <b>Hay</b> o <b>Falta</b> en cada cosa. Al final, apretá el botón verde y mandame la lista por WhatsApp. ¡Gracias!</p>
  <div class="count" id="count"></div>
  <div id="list"></div>

  <h2>Otra cosa que falte</h2>
  <textarea class="otros" id="otros" placeholder="Ej.: pañales, jabón, bolsas de residuo…"></textarea>

  <div class="msg">
    <h2>Mensaje que se va a mandar</h2>
    <pre id="preview"></pre>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <button class="reset" id="reset" type="button">Empezar de nuevo</button>
</div>

<div class="bar"><div class="bar-in">
  <a class="act wa" id="wa" href="#" target="_blank" rel="noopener">Mandar por WhatsApp</a>
  <button class="act sec" id="copy" type="button">Copiar</button>
</div></div>

<script>
const DATA = [
  ["Heladera", [["Leche de avena","Biba, la de Juan"],["Leche común"],["Manteca"],["Crema de leche"],["Queso rallado"],["Queso en fetas","danbo o cheddar"],["Jamón cocido"],["Salame en fetas"],["Huevos"],["Flancitos","Danette"],["Yogur"]]],
  ["Almacén", [["Fideos","tallarines"],["Arroz"],["Lentejas"],["Harina"],["Harina de almendra"],["Pan rallado"],["Pan rallado sin gluten"],["Panko"],["Aceite de girasol"],["Aceite de oliva"],["Atún en lata"],["Mayonesa"],["Azúcar"],["Tapas de empanada"],["Tomate triturado / puré"],["Caldo en cubos"],["Sal"],["Condimentos","orégano, pimentón, pimienta"],["Vinagre"],["Café en grano"],["Galletitas","Toddy u otras"],["Galletitas / tostadas de arroz"],["Talitas"],["Bolitas de chocolate","cereal"],["Pan","de masa madre"]]],
  ["Bebidas", [["Pomelo","Paso de los Toros"],["Coca-Cola en lata","latitas, no botella"],["Jugo / limonada"],["Soda"]]],
  ["Verdulería", [["Bananas"],["Cebolla"],["Tomate"],["Papa"],["Zanahoria"],["Lechuga"],["Limón"],["Manzanas"],["Ajo"],["Perejil"],["Zapallo / zapallitos"]]],
  ["Carnicería y pescado", [["Carne","churrasquitos / colita"],["Carne para milanesas"],["Salchichas"],["Pescado","filet de merluza"]]],
  ["Limpieza", [["Detergente"],["Lavandina"],["Limpiador de piso"],["Esponjas"],["Rollo de cocina"],["Bolsas de residuo"],["Jabón para la ropa"],["Suavizante"]]],
  ["Baño", [["Papel higiénico"],["Jabón de tocador"],["Pasta de dientes"]]]
];
const KEY="checklist-super-v2"; let st={};
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const $=id=>document.getElementById(id);
const list=$("list");
DATA.forEach(([cat,items],ci)=>{
  const h=document.createElement("h2");h.textContent=cat;list.appendChild(h);
  const ul=document.createElement("ul");
  items.forEach(([n,sub],ii)=>{
    const id=ci+"-"+ii, li=document.createElement("li");
    li.dataset.id=id; li.dataset.name=n; if(st[id]) li.dataset.s=st[id];
    li.innerHTML=`<div class="name">${n}${sub?`<small>${sub}</small>`:""}</div>
      <div class="btns"><button type="button" class="b bh" aria-label="Hay ${n}">Hay</button><button type="button" class="b bf" aria-label="Falta ${n}">Falta</button></div>`;
    li.querySelector(".bh").onclick=()=>set(li,"hay");
    li.querySelector(".bf").onclick=()=>set(li,"falta");
    ul.appendChild(li);
  });
  list.appendChild(ul);
});
const otros=$("otros"); otros.value=st._otros||"";
otros.addEventListener("input",()=>{st._otros=otros.value;save();render()});
function set(li,v){const id=li.dataset.id;if(st[id]===v){delete st[id];delete li.dataset.s}else{st[id]=v;li.dataset.s=v}save();render()}
function text(){
  const falta=[...document.querySelectorAll('li[data-s="falta"]')].map(li=>"• "+li.dataset.name);
  const extra=(st._otros||"").split(/\n|,/).map(s=>s.trim()).filter(Boolean).map(s=>"• "+s);
  const all=falta.concat(extra);
  return all.length?"Hola Juan, en casa falta:\n"+all.join("\n"):"Hola Juan, revisé y no falta nada.";
}
function render(){
  const total=document.querySelectorAll("li").length;
  const f=document.querySelectorAll('li[data-s="falta"]').length, h=document.querySelectorAll('li[data-s="hay"]').length;
  $("count").innerHTML=`<span class="pill f">Falta: ${f}</span><span class="pill h">Hay: ${h}</span><span class="pill">Sin revisar: ${total-f-h}</span>`;
  const t=text(); $("preview").textContent=t;
  $("wa").href="https://wa.me/?text="+encodeURIComponent(t);
}
$("copy").onclick=()=>{
  const t=text(), done=()=>{$("toast").textContent="Copiado. Pegalo en WhatsApp."};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done).catch(sel)}else sel();
  function sel(){const r=document.createRange();r.selectNodeContents($("preview"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("toast").textContent="Texto seleccionado: mantené apretado y copiá."}
};
let armed=false;
$("reset").onclick=()=>{
  if(!armed){armed=true;$("reset").textContent="Tocá otra vez para borrar todo";setTimeout(()=>{armed=false;$("reset").textContent="Empezar de nuevo"},3000);return}
  st={};save();otros.value="";document.querySelectorAll("li").forEach(li=>delete li.dataset.s);armed=false;$("reset").textContent="Empezar de nuevo";$("toast").textContent="";render();
};
render();
</script>
</body></html>
